<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Report</title>
    <link rel="stylesheet" href="style.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
</head>
<body>
    <nav class="navbar"><div></div>
    <div><h1>Shift Report Log</h1></div>
    <div>&#128100; User:</div><div id="user">Anonymous</div></nav>
    <main>
        <section id="sct_ShiftOverview">
            <div id="div_shiftControls"></div>
            <div id="div_shiftChart"><canvas id="myChart" class="chart"></canvas></div>
        </section>
        <section id="sct_shiftData">
            <div id="div_shiftData_Live"></div>
            <div id="div_shiftData_Current"></div>
            <div id="div_shiftData_Last"></div>
        </section>
        <section id="sct_shiftLog">
            <div id="div_logControls">
                <!--span class="logEntry">TimeStamp</span>
                <span class="logEntry"><span class="logType-yield">Type</span></span>
                <span class="logEntry">
                    <select name="logStatus" id="logStatus" class="custom-select logStatus-open">
                        <option value="open" selected><span class="logStatus-open">Open</span></option>
                        <option value="in-progress"><span class="logStatus-inProgress">In Progress</span></option>
                        <option value="Closed"><span class="logStatus-closed">Closed</span></option>
                    </select>
                </span>
                <span class="logEntry">Comment</span>
                <span class="logEntry">Owner</span--></div>
            <div id="div_logDisplay">
                <div class="logEntry">
                    <span class="logType">Event Type</span>
                    <span class="logType">TimeStamp</span>
                    <span class="logType">Event Status</span>
                    <span class="logType">Event Comment</span>
                    <span class="logType">Event Owner</span>
                    <span class="logType">   </span><!-- Controls Span - left empty for spacing-->
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
