<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Report</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <nav class="navbar">
        <div><h1>Shift Report Log</h1></div>
    </nav>
    <main>
        <section id="sct_ShiftOverview">
            <div id="div_shiftChart" class="container">
                <h2>Shift output chart</h2>
                <canvas id="myChart" class="chart"></canvas>
            </div>
        </section>
        <section id="sct_shiftLog" >
            <div id="div_logDisplay" class="container">
                <h2>Operations Event Log</h2>
                <div class="logEntry">
                    <span class="logType">Event Type</span>
                    <span class="logType">TimeStamp</span>
                    <span class="logType">Event Status</span>
                    <span class="logType">Event Comment</span>
                    <span class="logType">   </span><!-- Controls Span - left empty for spacing-->
                </div>
            </div>
            <div id="div_logControls" class="logControls"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
