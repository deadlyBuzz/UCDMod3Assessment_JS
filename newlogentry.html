<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New manual Log Entry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form id="newLogEntryForm" class="formContainer">
            <div class="formSegment">
                <h1>New Manual log</h1>
                <p>Enter the details to manually create a new log entry</p>
            </div>
            <div class="formSegment">
                <label for="logEntryType">Type</label>
                <select name="logEntryType" id="logEntryType" class="custom-select">
                    <option value="" selected><span>Please select a category</span></option>
                    <option value="Downtime"><span class="logType-downtime">Downtime</span></option>
                    <option value="Safety"><span class="logType-safety">Safety</span></option>
                    <option value="Yield"><span class="logType-yield">Yield</span></option>
                    <option value="Cycletime"><span class="logType-cycletime">Cycletime</span></option>
                    <option value="Output"><span class="logType-output">Output</span></option>
                </select>
                <small id="typeHelp">Select the Event Type from the Dropdown.</small>
            </div>
            <div class="formSegment">
                <label for="logEntryStatus">Status</label>
                <select name="logEntryStatus" id="logEntryStatus" class="custom-select logStatus-open">
                    <option value="Open" selected><span class="logStatus-open">Open</span></option>
                    <option value="In progress"><span class="logStatus-inProgress">In Progress</span></option>
                    <option value="Closed"><span class="logStatus-closed">Closed</span></option>
                </select>
                <small id="statusHelp">Select the Status of the event from the Dropdown</small>
            </div>
            <div class="formSegment">
                <label for="logEntryNotes">Notes</label>
                <input type="text" name="logEntryNotes" id="logEntryNotes" placeholder="Enter Notes or Skip if unavailable">
                <small id="notesHelp">Enter Notes describing the event<br/>
                The Characters &#123; &#125; &#95; and  &#42; are not allowed.</small>
            </div>
            <div>
                <button id="submitButton" type="submit" class="startButton">Create Log Entry</button>
                <button id="cancelButton" type="submit" class="endButton">Cancel</button>
            </div>
        </form>
        <div class="errorDisplay">
            <ul id="errorDisplay"></ul>
        </div>
    </main>
    <script src="formscript.js"></script>
</body>
</html>
